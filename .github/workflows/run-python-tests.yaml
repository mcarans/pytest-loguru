name: Run tests

on:
  workflow_dispatch:
  # Called by publish.yaml so a release only publishes after the tests pass.
  workflow_call:
  push:
    branches-ignore: [gh-pages, "dependabot/**"]
  pull_request:
    branches-ignore: [gh-pages]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python and the classifiers in
        # pyproject.toml. The default in .python-version runs lint and
        # publishes the reports.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    name: build (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit
        if: matrix.python-version == '3.12'
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Test with pytest
        run: uv run pytest

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always() && matrix.python-version == '3.12'
        with:
          files: test-results.xml

      - name: Publish in Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        if: always() && matrix.python-version == '3.12'
        with:
          flag-name: tests
          format: lcov
